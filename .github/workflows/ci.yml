name: CI

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'components/espectre/**'
      - 'espectre-c5-template.yaml'
      - 'espectre-c6-template.yaml'
      - 'examples/**'
      - '**.py'
      - 'requirements-ci.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'components/espectre/**'
      - 'espectre-c5-template.yaml'
      - 'espectre-c6-template.yaml'
      - 'examples/**'
      - '**.py'
      - 'requirements-ci.txt'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install ruff
        run: pip install "$(grep '^ruff==' requirements-ci.txt)"

      - name: Ruff (syntax errors + pyflakes)
        run: ruff check --select E9,F --output-format github .

  compile:
    name: Compile ${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - espectre-c5-template.yaml
          - espectre-c6-template.yaml
          - examples/minimal_self_sensing.yaml
          - examples/minimal_self_sensing_c3.yaml
          - examples/pairwise_tx_node.yaml
          - examples/pairwise_rx_node.yaml

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install ESPHome (pinned)
        run: pip install -r requirements-ci.txt

      - name: Cache toolchains
        uses: actions/cache@v6
        with:
          path: |
            ~/.espressif
            ~/.platformio
          key: toolchain-${{ runner.os }}-${{ hashFiles('requirements-ci.txt') }}-${{ matrix.config }}
          restore-keys: |
            toolchain-${{ runner.os }}-${{ hashFiles('requirements-ci.txt') }}-

      - name: Create secrets.yaml
        run: .github/scripts/ci-secrets.sh

      - name: Compile
        run: esphome compile ${{ matrix.config }}
