# ESPectre WiFi CSI Motion Detection — DFRobot FireBeetle 2 ESP32-C6 (DFR1075)
#
# Passive presence detection using WiFi signal analysis.
#
# Hardware: DFRobot FireBeetle 2 ESP32-C6 (ESP32-C6FH4, RISC-V 160MHz)
#   - WiFi 6 (802.11ax) 2.4GHz only — more subcarriers in HE mode vs older chips
#   - 512KB SRAM, 4MB Flash, NO PSRAM
#   - LED: GPIO15 (active high)
#   - Boot: GPIO9, USB CDC native
# Integration: MQTT → Fusion Service + Home Assistant auto-discovery
#
# Based on: https://github.com/francescopace/espectre
# Fork: local components/espectre with public get_detector() API

esphome:
  name: espectre-node-c6        # <-- change to your node name
  friendly_name: "WiFi CSI - Node C6"
  min_version: 2026.4.0
  project:
    name: francescopace.espectre
    version: "3.0.0-fork"

esp32:
  board: esp32-c6-devkitc-1
  variant: ESP32C6               # RISC-V, max 160MHz — cpu_frequency cannot be increased
  framework:
    type: esp-idf

# NO PSRAM on DFR1075 — do NOT add psram: section

# Local fork with public get_detector() API
external_components:
  - source:
      type: local
      path: components
    components: [ espectre ]

# ESPectre — WiFi CSI Motion Detection
espectre:
  id: espectre_csi
  segmentation_window_size: 100
  lowpass_enabled: true
  lowpass_cutoff: 7.0
  hampel_enabled: true
  hampel_window: 9
  hampel_threshold: 3.0
  hysteresis_factor: 0.5
  auto_calibration_minutes: 10
  movement_sensor:
    name: "Movement Score"
  motion_sensor:
    name: "Motion Detected"
  presence_sensor:
    name: "Presence Detected"
  breathing_rate_sensor:
    name: "Breathing Rate"
  breathing_sensor:
    name: "Breathing Score"
  phase_turbulence_sensor:
    name: "Phase Turbulence"
  dser_sensor:
    name: "DSER"
  plcr_sensor:
    name: "PLCR"
  threshold_number:
    name: "Threshold"
  calibrate_switch:
    name: "Calibrate"

# WiFi — connect to your network
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ESPectre Node C6 Fallback"
    password: "esp32csi"

captive_portal:

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

# MQTT — direct publish for fusion service
mqtt:
  broker: !secret mqtt_broker
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true
  topic_prefix: esphome/csi_node_c6    # <-- change together with name
  on_connect:
    - mqtt.publish_json:
        topic: "esphome/discover/csi_node_c6"
        payload: |-
          auto ips = esphome::network::get_ip_addresses();
          root["ip"] = ips.empty() ? "unknown" : ips[0].str();
          root["friendly_name"] = "WiFi CSI - Node C6";
        retain: true
  on_message:
    - topic: esphome/csi_node_c6/filter/lowpass_cutoff/command
      then:
        - lambda: |-
            float c = atof(x.c_str());
            if (c >= 5.0f && c <= 20.0f)
              id(espectre_csi).get_detector()->configure_lowpass(true, c);
    - topic: esphome/csi_node_c6/command/recalibrate
      then:
        - lambda: |-
            id(espectre_csi).trigger_recalibration();

# FireBeetle 2 ESP32-C6 built-in LED (GPIO15, active high)
output:
  - platform: gpio
    pin: GPIO15
    id: led_output

light:
  - platform: binary
    name: "Status LED"
    id: status_led
    output: led_output

# CSI template sensors (full detector access via fork)
sensor:
  - platform: template
    name: "CSI Turbulence"
    id: csi_turbulence
    unit_of_measurement: ""
    accuracy_decimals: 4
    update_interval: 1s
    lambda: |-
      auto d = id(espectre_csi).get_detector();
      if (d) return d->get_last_turbulence();
      return NAN;

  - platform: template
    name: "CSI Variance"
    id: csi_variance
    unit_of_measurement: ""
    accuracy_decimals: 4
    update_interval: 1s
    lambda: |-
      auto d = id(espectre_csi).get_detector();
      if (d) return d->get_motion_metric();
      return NAN;

  - platform: template
    name: "CSI Active Threshold"
    id: csi_active_threshold
    unit_of_measurement: ""
    accuracy_decimals: 4
    update_interval: 5s
    lambda: |-
      return id(espectre_csi).get_threshold();

  - platform: template
    name: "CSI Packets Total"
    id: csi_packets
    unit_of_measurement: "pkt"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      auto d = id(espectre_csi).get_detector();
      if (d) return (float)d->get_total_packets();
      return NAN;

  - platform: template
    name: "CSI Mean Turbulence"
    id: csi_mean_turbulence
    unit_of_measurement: ""
    accuracy_decimals: 4
    update_interval: 1s
    lambda: |-
      auto d = id(espectre_csi).get_detector();
      if (d && d->is_ready()) return d->get_mean_turbulence();
      return NAN;

  - platform: template
    name: "CSI Phase Turbulence"
    id: csi_phase_turbulence
    unit_of_measurement: ""
    accuracy_decimals: 4
    update_interval: 1s
    lambda: |-
      auto d = id(espectre_csi).get_detector();
      if (d) return d->get_last_phase_turbulence();
      return NAN;

  - platform: template
    name: "CSI Amplitude Sum"
    id: csi_amplitude_sum
    unit_of_measurement: ""
    accuracy_decimals: 2
    update_interval: 1s
    lambda: |-
      auto d = id(espectre_csi).get_detector();
      if (d) {
        auto amps = d->get_last_amplitudes();
        uint8_t n = d->get_num_amplitudes();
        float sum = 0;
        for (uint8_t i = 0; i < n; i++) sum += amps[i];
        return sum;
      }
      return NAN;

  - platform: template
    name: "CSI Ratio Turbulence"
    id: csi_ratio_turbulence
    unit_of_measurement: ""
    accuracy_decimals: 4
    update_interval: 1s
    lambda: |-
      auto d = id(espectre_csi).get_detector();
      if (d) return d->get_last_ratio_turbulence();
      return NAN;

  - platform: template
    name: "CSI Breathing Score"
    id: csi_breathing_score
    unit_of_measurement: ""
    accuracy_decimals: 3
    update_interval: 1s
    lambda: |-
      auto d = id(espectre_csi).get_detector();
      if (d && d->is_ready()) return d->get_breathing_score();
      return NAN;

  - platform: template
    name: "CSI Idle Mean Turbulence"
    id: csi_idle_mean_turbulence
    unit_of_measurement: ""
    accuracy_decimals: 4
    update_interval: 1s
    lambda: |-
      auto d = id(espectre_csi).get_detector();
      if (d && d->are_idle_baselines_initialized())
        return d->get_idle_mean_turbulence();
      return NAN;

  - platform: template
    name: "CSI Composite Score"
    id: csi_composite_score
    unit_of_measurement: ""
    accuracy_decimals: 3
    update_interval: 1s
    lambda: |-
      auto d = id(espectre_csi).get_detector();
      if (!d || !d->is_ready()) return NAN;
      float thr = d->get_threshold();
      float var_ratio = (thr > 0) ? d->get_motion_metric() / thr : 0.0f;
      float idle_pt = d->get_idle_mean_phase_turbulence();
      float pt_ratio = (idle_pt > 0) ? d->get_last_phase_turbulence() / idle_pt : 0.0f;
      return var_ratio + 0.5f * pt_ratio;

  - platform: template
    name: "CSI Amplitude Deviation"
    id: csi_amplitude_deviation
    unit_of_measurement: ""
    accuracy_decimals: 3
    update_interval: 1s
    lambda: |-
      auto d = id(espectre_csi).get_detector();
      if (!d || !d->are_idle_baselines_initialized()) return NAN;
      auto amps = d->get_last_amplitudes();
      uint8_t n = d->get_num_amplitudes();
      float sum = 0;
      for (uint8_t i = 0; i < n; i++) sum += amps[i];
      float baseline = d->get_idle_amplitude_baseline();
      return (baseline > 0) ? sum / baseline : NAN;

text_sensor:
  - platform: template
    name: "CSI Subcarrier Amplitudes"
    id: csi_subcarrier_amplitudes
    update_interval: 2s
    lambda: |-
      auto d = id(espectre_csi).get_detector();
      if (!d) return std::string("");
      auto amps = d->get_last_amplitudes();
      uint8_t n = d->get_num_amplitudes();
      char buf[256]; int pos = 0;
      for (uint8_t i = 0; i < n; i++) {
        if (i > 0) buf[pos++] = ',';
        pos += snprintf(buf+pos, sizeof(buf)-pos, "%.1f", amps[i]);
      }
      return std::string(buf, pos);

binary_sensor:
  - platform: template
    name: "CSI Calibrating"
    id: csi_calibrating
    lambda: |-
      return id(espectre_csi).is_calibrating();

  - platform: template
    name: "CSI Detector Ready"
    id: csi_detector_ready
    lambda: |-
      auto d = id(espectre_csi).get_detector();
      return d && d->is_ready();
